<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}{{ site_settings.site_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <style>
        :root {
            --primary: {{ site_settings.primary_color }};
            --accent: {{ site_settings.accent_color }};
            --bg: {{ site_settings.background_color }};
            --highlight: #fff000;
            --highlight-dark: #ddc000;
            --magenta: #e10078;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="{% block main_class %}container py-4{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% if site_settings.footer_text %}
        <footer class="site-footer text-center py-3 mt-auto">
            <div class="container">
                <small>{{ site_settings.footer_text }}</small>
            </div>
        </footer>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
